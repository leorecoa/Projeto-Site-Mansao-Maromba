
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mansão Maromba | Depósito Digital Premium</title>
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/2CMQ6GJ.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              syncopate: ['Syncopate', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: #000;
        color: #fff;
        overflow-x: hidden;
      }
      .font-syncopate { font-family: 'Syncopate', sans-serif; }
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(1deg); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      @keyframes neon-streak {
        0% { transform: translateX(-100%) skewX(-45deg); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateX(250%) skewX(-45deg); opacity: 0; }
      }
      .neon-streak {
        position: absolute;
        height: 1px;
        width: 100%;
        background: linear-gradient(90deg, transparent, currentColor, transparent);
        animation: neon-streak 4s infinite linear;
        filter: drop-shadow(0 0 10px currentColor);
      }

      @keyframes splash-fade-out {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(1.1); }
      }
      .fade-out { animation: splash-fade-out 0.8s forwards; }

      .perspective-stage { perspective: 1500px; transform-style: preserve-3d; }

      @keyframes pulse-vogue {
        0%, 100% { opacity: 0.2; transform: scale(1); filter: blur(80px); }
        50% { opacity: 0.5; transform: scale(1.15); filter: blur(50px); }
      }
      .pulse-glow-vogue { animation: pulse-vogue 4s ease-in-out infinite; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/": "https://esm.sh/react@19.0.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.463.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
