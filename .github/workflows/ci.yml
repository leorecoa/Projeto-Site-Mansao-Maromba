name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check public env exposure
        run: npm run env:check

      - name: Scan repository secrets
        run: npm run secrets:scan

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Check build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Run tests
        run: npm run test:coverage

  e2e-critical-checkout:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sanity check Playwright config fallback
        run: |
          node -e "const fs=require('fs'); const cfg=fs.readFileSync('playwright.config.ts','utf8'); if(!cfg.includes('const hasUserStorageState = fs.existsSync(userStorageStatePath)')) throw new Error('Missing hasUserStorageState guard.'); if(!cfg.includes(\"...(hasUserStorageState ? { storageState: 'tests/e2e/.auth/user.json' } : {})\")) throw new Error('Missing conditional storageState fallback.');"

      - name: Create fallback auth storageState
        run: |
          mkdir -p tests/e2e/.auth
          printf '{"cookies":[],"origins":[]}' > tests/e2e/.auth/user.json

      - name: Run critical checkout E2E
        run: npx playwright test tests/e2e/checkout.spec.ts --project=chromium --no-deps
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'public-anon-key-for-ci' }}

  e2e-error-boundary-gate:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, e2e-critical-checkout]

    steps:
      - uses: actions/checkout@v4

      - name: Decide if E2E gate should run
        id: gate
        shell: bash
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -n "$ADMIN_EMAIL" && -n "$ADMIN_PASSWORD" && -n "$VITE_SUPABASE_URL" && -n "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping E2E gate: required secrets are missing."
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install
        if: steps.gate.outputs.should_run == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Install Playwright Chromium
        if: steps.gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Create fallback auth storageState
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p tests/e2e/.auth
          printf '{"cookies":[],"origins":[]}' > tests/e2e/.auth/user.json

      - name: Run ErrorBoundary gate (public + admin)
        if: steps.gate.outputs.should_run == 'true'
        run: npx playwright test tests/e2e/error-boundary.spec.ts --project=chromium --no-deps
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Playwright report artifact
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-boundary-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  e2e-smoke-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create fallback auth storageState
        run: |
          mkdir -p tests/e2e/.auth
          printf '{"cookies":[],"origins":[]}' > tests/e2e/.auth/user.json

      - name: Run PR smoke checkout redirect
        run: npx playwright test tests/e2e/checkout.spec.ts --project=chromium --grep "nao autenticado" --no-deps
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'public-anon-key-for-ci' }}
